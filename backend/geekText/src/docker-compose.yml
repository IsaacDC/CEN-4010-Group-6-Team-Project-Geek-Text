services:
  db:
    image: mysql:latest
    container_name: GeekText
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=geektext
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: